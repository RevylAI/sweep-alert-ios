# Revyl CLI Configuration
# Generated by: revyl init
# Edit these settings or run: revyl config set <key> <value>
# Docs: https://docs.revyl.ai/cli/hot-reload

project:
    name: ios-sweep-alert
build:
    system: Xcode
    command: xcodebuild -project SweepAlertSwift.xcodeproj -scheme * -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
    output: build/Build/Products/Debug-iphonesimulator/*.app
    platforms:
        ios:
            app_id: ee303738-1c98-4c7b-b471-ed70d8ea5245
            command: xcodebuild -project SweepAlertSwift.xcodeproj -scheme 'SweepAlertSwift' -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
            output: build/Build/Products/Debug-iphonesimulator/SweepAlertSwift.app
            scheme: SweepAlertSwift
defaults:
    open_browser: false
    timeout: 1800
