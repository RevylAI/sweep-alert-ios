<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SweepAlert</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1463f3;
      --ink: #111827;
      --muted: #667085;
      --bg: #f6f7fb;
      --line: rgba(17, 24, 39, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #dff7e8 0, transparent 32rem), var(--bg);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    section {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 60px rgba(15, 23, 42, .12);
    }

    .mark {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      border-radius: 18px;
      margin-bottom: 18px;
      background: rgba(20, 99, 243, .1);
      color: var(--blue);
      font-size: 30px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="mark">S</div>
      <h1>SweepAlert</h1>
      <p>Shared street-cleaning reminders for car crews.</p>
    </section>
  </main>
</body>
</html>
