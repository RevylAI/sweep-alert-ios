<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SweepAlert Invite</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1463f3;
      --ink: #111827;
      --muted: #667085;
      --bg: #f6f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #dff7e8 0, transparent 32rem), var(--bg);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    section {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(17, 24, 39, .08);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 60px rgba(15, 23, 42, .12);
    }

    .mark {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      border-radius: 18px;
      margin-bottom: 18px;
      background: rgba(20, 99, 243, .1);
      color: var(--blue);
      font-size: 30px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.45;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      width: 100%;
      padding: 0 18px;
      border-radius: 14px;
      background: var(--blue);
      color: white;
      text-decoration: none;
      font-weight: 750;
    }

    small {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="mark">S</div>
      <h1>Join this SweepAlert car crew</h1>
      <p>Open the invite in SweepAlert to get shared parking reminders and move updates.</p>
      <a id="open-app" href="ai.revyl.sweepalert.swift://invite/">Open SweepAlert</a>
      <small>If the app is not installed, keep this link and open it again after installing SweepAlert.</small>
    </section>
  </main>
  <script>
    const parts = window.location.pathname.split("/").filter(Boolean);
    const token = parts[0] === "invite" ? parts[1] || "" : "";
    const appUrl = `ai.revyl.sweepalert.swift://invite/${encodeURIComponent(token)}`;
    document.getElementById("open-app").href = appUrl;
  </script>
</body>
</html>
